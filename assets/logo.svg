<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="50%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="55%" stop-color="#f9a8d4"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect x="24" y="24" width="208" height="208" rx="52" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="208" height="208" rx="52" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="4"/>
  <!-- Frosted glass card silhouette -->
  <rect x="54" y="64" width="148" height="128" rx="24" fill="rgba(255,255,255,0.16)" stroke="rgba(255,255,255,0.35)" stroke-width="2.5"/>
  <!-- Four-point Gemini star -->
  <path d="M128 74 C132 108 148 124 182 128 C148 132 132 148 128 182 C124 148 108 132 74 128 C108 124 124 108 128 74 Z" fill="url(#starGrad)" filter="url(#glow)"/>
  <!-- Decorative palette dots -->
  <circle cx="80" cy="88" r="7" fill="#f472b6"/>
  <circle cx="176" cy="168" r="6" fill="#fbbf24"/>
  <circle cx="176" cy="88" r="5" fill="#38bdf8"/>
</svg>
